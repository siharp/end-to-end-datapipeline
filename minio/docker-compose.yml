services:
  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z # Versi terbaru dari image MinIO
    container_name: minio-server
    ports:
      - "9000:9000"  # Port untuk akses API
      - "9001:9001"  # Port untuk konsol web
    volumes:
      - ./data:/data  # Volume untuk menyimpan data secara persisten
    environment:
      MINIO_ROOT_USER: minioadmin  # Username untuk akses MinIO
      MINIO_ROOT_PASSWORD: minioadmin  # Password untuk akses MinIO
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - airflow_default

  mc:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    container_name: mc
    depends_on:
      minio:
        condition: service_healthy
    stdin_open: true   
    tty: true
    entrypoint: ["/bin/sh","-c"]
    command: ["tail -f /dev/null"] 
    networks:
      - airflow_default

networks:
  airflow_default:
    external: true